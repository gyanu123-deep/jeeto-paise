<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0d12;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-box {
            width: 350px;
            padding: 35px;

            background: #181b22;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            text-align: center;
        }

        h1 {
            color: orange;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;

            border: none;
            border-radius: 8px;

            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: orange;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: darkorange;
        }

        .error {
            color: #ff5555;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <div class="admin-box">

        <h1>Admin Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Admin username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
