<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0d12;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: orange;
        }

        .table-box {
            background: #181b22;
            padding: 20px;
            border-radius: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: orange;
            color: black;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        tr:hover {
            background: #222630;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>College Event - Registered Users</h1>

        <div class="table-box">

            {% if users %}

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Registration Time</th>
                    </tr>

                </thead>

                <tbody>

                    {% for user in users %}

                    <tr>

                        <td>{{ user[0] }}</td>

                        <td>{{ user[1] }}</td>

                        <td>{{ user[2] }}</td>

                        <td>{{ user[3] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            {% else %}

            <div class="empty">
                अभी कोई registration नहीं हुआ है.
            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
